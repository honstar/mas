name: IO Studio PR Check
on:
    push:
        paths:
            - 'io/studio/**'

jobs:
    tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: io/studio

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: io/studio/package.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    deploy:
        needs: tests
        uses: ./.github/workflows/io-studio-deploy.yaml
        with:
            run_tests: false
        secrets:
            ENV: ${{ secrets[format('AIO_STUDIO_ENV_{0}', github.actor)] || secrets.AIO_STUDIO_ENV_HONSTAR }}
            AIO: ${{ secrets[format('AIO_STUDIO_AIO_{0}', github.actor)] || secrets.AIO_STUDIO_AIO_HONSTAR }}
