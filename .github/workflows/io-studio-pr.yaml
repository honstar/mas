name: IO Studio PR Check
on:
    push:
        paths:
            - 'io/studio/**'

jobs:
    tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: io/studio

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: io/studio/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: io/studio
        needs: tests

        steps:
            - name: Fetch secrets from vault
              uses: actions/vault-action@v2.4
              with:
                  url: https://vault-amer.adobe.net
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  secrets: |
                      cloudtech_wcms/data/merch-at-scale/aio-studio/honstar dummy

            - name: Echo dummy secret
              run: echo $DUMMY
