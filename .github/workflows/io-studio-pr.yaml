name: IO Studio PR Check
on:
    push:
        paths:
            - 'io/studio/**'

jobs:
    tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: io/studio

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: io/studio/package.json

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: io/studio
        needs: tests

        steps:
            - name: GH github.actor
              run: |
                echo ${{ github.actor }}
                exit 1

            - name: Prepare .aio and .env files
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: io/studio/package.json

            - name: Install dependencies
              run: npm ci
